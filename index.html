<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeMè</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{--bg:#0f1220;--card:#1a1f35;--acc:#6c8cff;--text:#eef0fb;--muted:#8a90b3;--ok:#3ecf8e;--err:#ff6b6b;--blue:#3f6cff;--red:#e0503a;--gold:#e0b23f}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:1.2rem;margin:0 0 16px;text-align:center}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2c3355;background:#12162a;color:var(--text);font-size:1rem}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;font-size:1rem;margin-top:14px;cursor:pointer}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.secondary{background:#2c3355}
  .player-row{display:flex;gap:8px;margin-bottom:8px}
  .player-row input{flex:1}
  .player-row button{width:auto;padding:10px 14px;margin:0;background:var(--err)}
  .add-btn{background:var(--card);border:1px dashed #2c3355;color:var(--muted)}
  .name-pick{display:flex;flex-wrap:wrap;gap:8px}
  .name-pick button{width:auto;margin:0;background:#2c3355;flex:1;min-width:100px}
  .name-pick button:disabled{background:#181c30;color:#4a5078}
  .msg{text-align:center;padding:10px;border-radius:8px;margin-top:10px;font-size:.9rem}
  .msg.err{background:#3a1e26;color:var(--err)}
  .link-box{display:flex;gap:8px}
  .link-box input{flex:1;font-size:.8rem}
  .hidden{display:none!important}
  .center{text-align:center;color:var(--muted);font-size:.9rem}
  .turn-banner{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:10px;padding:8px;border-radius:10px;background:#20264a}
  .turn-banner b{color:var(--gold)}
  .table{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:96px;padding:10px;background:#12162a;border-radius:10px;margin-bottom:10px}
  .chip{width:34px;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;color:#fff;text-align:center;position:relative;box-sizing:border-box}
  .chip.letter{background:#4b4f70;border:3px solid #000000}
  .chip.letter.blue{color:#1c2f8f}
  .chip.letter.red{color:#e0503a}
  .chip.special{background:#4b4f70;font-size:.5rem;padding:2px;border:3px solid #e0b23f}
  .chip.pending{width:64px;height:88px;box-shadow:0 0 0 3px var(--acc)}
  .chip.pending.letter{font-size:2.3rem}
  .chip.pending.special{flex-direction:column;gap:3px}
  .chip-icon-big{width:30px;height:30px;object-fit:contain}
  .pending-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
  .pending-caption{font-size:.72rem;font-weight:700;color:#eef0fb;text-align:center;max-width:96px;line-height:1.15}
  .chip.crossed{opacity:.5}
  .chip.crossed::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:3px;background:#fff;transform:rotate(-18deg)}
  .thumbs{display:flex;gap:10px}
  .thumbs button{font-size:1.2rem}
  .thumbs .up{background:var(--ok)}
  .thumbs .down{background:var(--err)}
  .timerRow{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
  .countdown{font-size:1.4rem;font-weight:700;color:var(--gold)}
  #btnTimer{width:auto;padding:10px 16px;background:#3a3560}
  .plist{list-style:none;padding:0;margin:0}
  .plist li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;margin-bottom:5px;background:#12162a;font-size:.85rem}
  .plist li.active{border:1px solid var(--acc)}
  .plist li.out{opacity:.5}
  .plist .stats{color:var(--muted);display:flex;gap:6px}
  .mini-chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;border-radius:5px;font-weight:800;font-size:.8rem;padding:0 5px}
  .mini-chip.green{background:#3ecf8e;color:#0f1220}
  .mini-chip.red{background:var(--red);color:#fff}
  .rank-item{display:flex;justify-content:space-between;padding:10px;border-radius:8px;margin-bottom:6px;background:#12162a}
  .rank-item .pos{color:var(--gold);font-weight:700}
  .flip-deck{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;margin:14px 0}
  .flip-deck .chip.back{background:#2c3355;font-size:1.1rem;font-weight:800;letter-spacing:.03em;width:64px;height:88px;border:2px dashed #45508a}
  .flip-deck span{color:var(--muted);font-size:.8rem}
  @keyframes flipIn{ from{transform:rotateY(100deg);opacity:.2} to{transform:rotateY(0deg);opacity:1} }
  .flip-anim{ animation: flipIn .45s ease-out }
  @keyframes popIn{ from{transform:scale(2.2);opacity:.4} to{transform:scale(1);opacity:1} }
  .pop-anim{ animation: popIn .35s ease-in }
  .game-code{text-align:center;font-size:2rem;font-weight:800;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
  .game-code-small{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:8px}
  .banner-img{display:block;max-width:100%;margin:0 auto 10px;border-radius:10px}
  .chip.back{position:relative;overflow:hidden}
  .chip.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .chip.back span{position:relative}
  .chip-icon{width:100%;height:100%;object-fit:contain;padding:3px}
</style>
</head>

function buildDeck(){
  const letters8 = ['A','E','I','O'];
  const letters6 = ['U','B','C','D','F','G','L','M','N','P','R','S','T'];
  const letters2 = ['H','Z','Q'];
  const deck = []; let id=0;
  const addLetter = (l,count) => { for(let i=0;i<count;i++) deck.push({id:id++, type:'letter', letter:l, color: i<count/2?'blue':'red'}); };
  letters8.forEach(l=>addLetter(l,8));
  letters6.forEach(l=>addLetter(l,6));
  letters2.forEach(l=>addLetter(l,2));
  const special = [
    ['4 SILLABE',2,null],['5 SILLABE',2,null],['INVERTI GIRO',2,'invert'],
    ['SALTA TURNO',2,'skip'],['GIRA DUE CARTE',2,'drawtwo'],['CAMBIA TUTTO',4,'swap'],
    ['CUCINA',1,null],['STORIA',1,null],['GEOGRAFIA',1,null],['NATURA',1,null],
    ['PROFESSIONI',1,null],['MARCHI',1,null],['PERSONAGGI',1,null]
  ];
  special.forEach(([label,count,eff]) => { for(let i=0;i<count;i++) deck.push({id:id++, type:'special', label, effect:eff}); });
  return deck;
}
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

$('btnCreate').onclick = async () => {
  const names = [...document.querySelectorAll('.pname')].map(i=>i.value.trim()).filter(Boolean);
  const passkey = $('passkey').value.trim();
  const cardsPer = parseInt($('cardsPer').value);
  const msg = $('createMsg');
  if(names.length<2 || names.length>12){ msg.innerHTML='<div class="msg err">Da 2 a 12 giocatori</div>'; return; }
  if(new Set(names).size!==names.length){ msg.innerHTML='<div class="msg err">Nomi duplicati</div>'; return; }
  if(!passkey){ msg.innerHTML='<div class="msg err">Inserisci una passkey</div>'; return; }

  const code = genCode();
  const deck = shuffle(buildDeck());
  const hands = {}; names.forEach((n,i)=>{ hands[n] = deck.slice(i*cardsPer,(i+1)*cardsPer).map(c=>c.id); });
  const deckLookup = {}; deck.forEach(c => deckLookup[c.id]=c);
  const claims = {}; names.forEach(n=>claims[n]=false);
  const errorPiles = {}; names.forEach(n=>errorPiles[n]=0);

  await db.ref('games/'+code).set({
    passkey, cardsPer, players: names, claims, deckLookup, hands,
    table: [], hidden: [], lastCardId: null, lastOwner: null, matchedTableId: null,
    errorPiles, turnIndex: 0, direction: 1, flipsRemaining: 1, nextRequiredFlips: 1,
    timerActive: false, timerBy: null, timerEndsAt: null,
    status: 'waiting', createdAt: Date.now()
  });
  $('linkOut').value = location.href.split('?')[0]+'?game='+code;
  $('codeOut').textContent = code;
  window.__lastCode = code;
  show('share');
};

$('btnCheckPass').onclick = async () => {
  const code = $('joinCode').value.trim().toUpperCase();
  const pass = $('joinPass').value.trim();
  const msg = $('joinMsg');
  if(!code||!pass){ msg.innerHTML='<div class="msg err">Compila entrambi i campi</div>'; return; }

  if(!snap.exists()){ msg.innerHTML='<div class="msg err">Partita non trovata</div>'; return; }
  if(snap.val().passkey!==pass){ msg.innerHTML='<div class="msg err">Passkey errata</div>'; return; }
  startJoinFlow(code, snap.val());
};

let currentGame = { code:null, playerName:null };

async function startJoinFlow(code, data){
  currentGame.code = code;
  if(!data) data = (await db.ref('games/'+code).get()).val();
  const saved = JSON.parse(localStorage.getItem('myGame')||'null');
  if(saved && saved.code===code && data.claims[saved.name]){ currentGame.playerName = saved.name; return openGameView(); }
  const wrap = $('nameOptions'); wrap.innerHTML='';
  data.players.forEach(name => {
    const b = document.createElement('button');
    b.textContent = name + (data.claims[name] ? ' ✓' : '');
    b.disabled = !!data.claims[name];
    b.onclick = () => claimName(code, name);
    wrap.appendChild(b);
  });
  show('pickName');
}

async function claimName(code, name){
  const res = await db.ref('games/'+code+'/claims/'+name).transaction(cur => cur ? undefined : true);
  if(!res.committed){ $('pickMsg').innerHTML='<div class="msg err">Nome già preso</div>'; return; }
  currentGame.playerName = name;
  localStorage.setItem('myGame', JSON.stringify({code, name}));
  const snap = await db.ref('games/'+code).get(); const data = snap.val();
  if(Object.values(data.claims).every(Boolean) && data.status==='waiting'){
    await db.ref('games/'+code+'/status').set('playing');
  }
  openGameView();
}

let countdownTimer = null;
let lastRenderedCardId = null;
let lastTableLen = 0;
let gameListenerCode = null;
function openGameView(){
  show('game');
  $('gameCodeSmall').textContent = 'Codice partita: '+currentGame.code;
  gameListenerCode = currentGame.code;
  db.ref('games/'+currentGame.code).on('value', snap => { if(snap.exists()) renderGame(snap.val()); });
}

function cardEl(card, small){
  const d = document.createElement('div');
  if(card.type==='letter'){
    d.className = 'chip letter ' + card.color;
    d.textContent = card.letter;
    return d;
  }
  d.className = 'chip special';
  const displayLabel = /^[45] SILLABE$/.test(card.label) ? 'SILLABE' : card.label;
  const iconUrl = CARD_ICONS[card.label];
  if(iconUrl){
    const img = document.createElement('img');
    img.src = iconUrl;
    img.alt = card.label;
    img.className = small ? 'chip-icon' : 'chip-icon-big';
    img.onerror = () => { d.removeChild(img); d.textContent = displayLabel; };
    d.appendChild(img);
  } else {
    d.textContent = displayLabel;
  }
  return d;
}

function activePlayers(data){ return data.players.filter(n => (data.hands[n]||[]).length>0); }

function nextIndex(data, dir){
  const n = data.players.length; let i = data.turnIndex;
  for(let guard=0; guard<n; guard++){
    i = ((i+dir)%n+n)%n;
    if((data.hands[data.players[i]]||[]).length>0) return i;
  }
  return null; // nessuno ha più carte
}

function renderGame(data){
  if(data.status==='finished'){ return renderRanking(data); }
  const me = currentGame.playerName;
  const hasPending = data.lastCardId!==null && data.lastCardId!==undefined;
  const pendingCard = hasPending ? data.deckLookup[data.lastCardId] : null;
  const requiresAnswer = pendingCard && !(pendingCard.type==='special' && AUTO_EFFECTS.includes(pendingCard.effect));
  const awaitingMyAnswer = hasPending && data.lastOwner===me;
  const iAmOut = (data.hands[me]||[]).length===0 && !awaitingMyAnswer;
  const myTurn = data.players[data.turnIndex]===me && !iAmOut;

  $('turnBanner').innerHTML = data.status==='waiting'
    ? 'In attesa che tutti si uniscano...'
    : (iAmOut ? '⏸️ Hai finito le carte, aspetti gli altri' : `Tocca a <b>${data.players[data.turnIndex].toUpperCase()}</b>`);

  const tableWrap = $('table'); tableWrap.innerHTML='';
  const table = data.table||[];
  table.forEach((t,i) => {
    const el = cardEl(data.deckLookup[t.id], true);
    if(t.id===data.matchedTableId) el.classList.add('crossed');
    if(i===table.length-1 && table.length>lastTableLen) el.classList.add('pop-anim');
    tableWrap.appendChild(el);
  });
  lastTableLen = table.length;

  if(hasPending){
    const el = cardEl(pendingCard);
    el.classList.add('pending');
    if(data.matchedTableId) el.classList.add('crossed');
    if(data.lastCardId!==lastRenderedCardId) el.classList.add('flip-anim');
    if(pendingCard.type==='special'){
      const wrap = document.createElement('div');
      wrap.className = 'pending-wrap';
      wrap.appendChild(el);
      const cap = document.createElement('div');
      cap.className = 'pending-caption';
      cap.textContent = /^[45] SILLABE$/.test(pendingCard.label) ? 'SILLABE' : pendingCard.label;
      wrap.appendChild(cap);
      tableWrap.appendChild(wrap);
    } else {
      tableWrap.appendChild(el);
    }
  }
  lastRenderedCardId = hasPending ? data.lastCardId : null;

  const thumbs = $('thumbs');
  thumbs.classList.toggle('hidden', !(hasPending && requiresAnswer && data.lastOwner===me));

  // cronometro
  const timerRow = $('timerRow'); const btnTimer = $('btnTimer');
  if(hasPending && requiresAnswer && data.lastOwner!==me && !data.timerActive){ btnTimer.classList.remove('hidden'); } else { btnTimer.classList.add('hidden'); }
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  if(data.timerActive && data.timerEndsAt){
    timerRow.classList.remove('hidden');
    const tick = () => {
      const left = Math.max(0, Math.ceil((data.timerEndsAt - Date.now())/1000));
      $('countdown').textContent = `⏱️ ${data.timerBy} ha messo fretta: ${left}s`;
      if(left<=0) clearInterval(countdownTimer);
    };
    tick();
    countdownTimer = setInterval(tick,250);
  } else {
    timerRow.classList.add('hidden');
    $('countdown').textContent = '';
  }

  $('flipDeck').classList.toggle('hidden', !(myTurn && !hasPending && data.status==='playing' && (data.hands[me]||[]).length>0));

  const pl = $('plist'); pl.innerHTML='';
  data.players.forEach((name,i) => {
    const li = document.createElement('li');
    const out = (data.hands[name]||[]).length===0;
    li.className = (i===data.turnIndex && !out ? 'active ' : '') + (out ? 'out' : '');
    li.innerHTML = `<span>${name}${name===me?' (tu)':''}${out?' — fuori':''}</span><span class="stats"><span class="mini-chip green">${(data.hands[name]||[]).length}</span><span class="mini-chip red">${data.errorPiles[name]||0}</span></span>`;
    pl.appendChild(li);
  });
}

function renderRanking(data){
  show('ranking');
  const sorted = data.players.map(n=>({name:n,count:data.errorPiles[n]||0})).sort((a,b)=>a.count-b.count);
  let rank = 0, prevCount = null;
  const list = $('rankList'); list.innerHTML='';
  sorted.forEach((p,i) => {
    if(p.count!==prevCount){ rank = i+1; prevCount = p.count; }
    const d = document.createElement('div'); d.className='rank-item';
    d.innerHTML = `<span class="pos">#${rank} ${p.name}</span><span>${p.count} carte raccolte</span>`;
    list.appendChild(d);
  });
}

$('btnExit').onclick = () => {
  localStorage.removeItem('myGame');
  if(gameListenerCode) db.ref('games/'+gameListenerCode).off();
  currentGame = { code:null, playerName:null };
  history.replaceState(null,'',location.pathname);
  show('home');
};

// ---------- AZIONI ----------
const gameRef = code => db.ref('games/'+code);

// muta data facendo avanzare il turno (o terminando la partita), in base a flipsRemaining
function computeAdvance(data, extraSkip){
  const remaining = (data.flipsRemaining||1) - 1;
  const currentHandEmpty = (data.hands[data.players[data.turnIndex]]||[]).length===0;
  if(remaining>0 && !currentHandEmpty){
    data.flipsRemaining = remaining;
    return;
  }
  const active = data.players.filter(n => (data.hands[n]||[]).length>0);
  if(active.length===0){ data.status='finished'; return; }
  if(active.length===1){
    // resta un solo giocatore in gioco: le sue carte rimanenti vengono raccolte da lui senza rispondere, partita finita
    const solo = active[0];
    const leftover = (data.hands[solo]||[]).length;
    data.errorPiles[solo] = (data.errorPiles[solo]||0) + leftover;
    data.hands[solo] = [];
    data.status = 'finished';
    return;
  }
  let ni = nextIndex(data, data.direction);
  if(extraSkip && ni!==null){ ni = nextIndex({...data, turnIndex: ni}, data.direction); }
  data.turnIndex = ni===null ? data.turnIndex : ni;
  data.flipsRemaining = data.nextRequiredFlips || 1;
  data.nextRequiredFlips = 1;
}

// risolve una carta ad effetto automatico (invert/skip/drawtwo) dopo la pausa di rivelazione
async function applyAutoEffect(code){
  await gameRef(code).transaction(data => {
    if(!data) return data;
    if(data.lastCardId===null || data.lastCardId===undefined) return data; // già risolta
    const card = data.deckLookup[data.lastCardId];
    if(!card || !(card.type==='special' && AUTO_EFFECTS.includes(card.effect))) return data;
    const owner = data.lastOwner;
    let extraSkip = false;
    if(card.effect==='invert') data.direction = data.direction*-1;
    if(card.effect==='skip') extraSkip = true;
    if(card.effect==='drawtwo') data.nextRequiredFlips = 2;
    data.table = [...(data.table||[]), {id:data.lastCardId, owner}];
    data.lastCardId=null; data.lastOwner=null; data.matchedTableId=null;
    computeAdvance(data, extraSkip);
    return data;
  });
}

$('flipDeck').onclick = async () => {
  const code = currentGame.code, me = currentGame.playerName;
  const res = await gameRef(code).transaction(data => {
    if(!data) return data;
    if(data.status!=='playing') return data;
    if(data.players[data.turnIndex]!==me) return data;
    if(data.lastCardId!==null && data.lastCardId!==undefined) return data; // c'è già una carta in sospeso
    const hand = (data.hands && data.hands[me]) || [];
    if(hand.length===0) return data;
    const cardId = hand[hand.length-1];
    const card = data.deckLookup[cardId];
    data.hands[me] = hand.slice(0,-1);
    data.lastCardId = cardId;
    data.lastOwner = me;
    data.matchedTableId = null;
    if(card.type==='letter'){
      const opp = card.color==='blue' ? 'red' : 'blue';
      const m = (data.table||[]).find(t => { const c = data.deckLookup[t.id]; return c.type==='letter' && c.letter===card.letter && c.color===opp; });
      if(m) data.matchedTableId = m.id;
    }
    if(card.type==='special' && card.effect==='swap'){
      (data.table||[]).forEach(t => { const c = data.deckLookup[t.id]; if(c.type==='letter'){ c.color = c.color==='blue'?'red':'blue'; } });
    }
    return data;
  });
  const val = res.snapshot.val();
  if(!res.committed || !val || val.lastOwner!==me) return;
  const card = val.deckLookup[val.lastCardId];
  if(card && card.type==='special' && AUTO_EFFECTS.includes(card.effect)){
    setTimeout(() => applyAutoEffect(code), 3000);
  }
};

$('btnUp').onclick = async () => {
  const code = currentGame.code, me = currentGame.playerName;
  await gameRef(code).transaction(data => {
    if(!data) return data;
    if(data.lastOwner!==me || data.lastCardId===null || data.lastCardId===undefined) return data;
    if(data.timerActive){
      const collected = (data.table||[]).length + (data.hidden||[]).length + 1;
      data.errorPiles[data.timerBy] = (data.errorPiles[data.timerBy]||0) + collected;
      data.table = []; data.hidden = [];
    } else {
      let table = [...(data.table||[])];
      let hidden = [...(data.hidden||[])];
      if(data.matchedTableId){
        const idx = table.findIndex(t => t.id===data.matchedTableId);
        if(idx>=0){ const removed = table.splice(idx,1)[0]; hidden.push(removed, {id:data.lastCardId, owner:data.lastOwner}); }
        else table.push({id:data.lastCardId, owner:data.lastOwner});
      } else {
        table.push({id:data.lastCardId, owner:data.lastOwner});
      }
      data.table = table; data.hidden = hidden;
    }
    data.lastCardId=null; data.lastOwner=null; data.matchedTableId=null;
    data.timerActive=false; data.timerBy=null; data.timerEndsAt=null;
    computeAdvance(data, false);
    return data;
  });
};

$('btnDown').onclick = async () => {
  const code = currentGame.code, me = currentGame.playerName;
  await gameRef(code).transaction(data => {
    if(!data) return data;
    if(data.lastOwner!==me || data.lastCardId===null || data.lastCardId===undefined) return data;
    const collected = (data.table||[]).length + (data.hidden||[]).length + 1;
    data.errorPiles[me] = (data.errorPiles[me]||0) + collected;
    data.table = []; data.hidden = [];
    data.lastCardId=null; data.lastOwner=null; data.matchedTableId=null;
    data.timerActive=false; data.timerBy=null; data.timerEndsAt=null;
    computeAdvance(data, false);
    return data;
  });
};

$('btnTimer').onclick = async () => {
  const code = currentGame.code, me = currentGame.playerName;
  await gameRef(code).transaction(data => {
    if(!data) return data;
    if(data.timerActive) return data;
    if(data.lastCardId===null || data.lastCardId===undefined) return data;
    if(data.lastOwner===me) return data;
    data.timerActive = true; data.timerBy = me; data.timerEndsAt = Date.now()+15000;
    return data;
  });
};

(async () => {
  const params = new URLSearchParams(location.search);
  const codeFromUrl = params.get('game') ? params.get('game').toUpperCase() : null;
  const saved = JSON.parse(localStorage.getItem('myGame')||'null');
  if(saved && (!codeFromUrl || codeFromUrl===saved.code)){
    const snap = await db.ref('games/'+saved.code).get();
    if(snap.exists() && snap.val().claims[saved.name]){
      currentGame.code = saved.code; currentGame.playerName = saved.name;
      return openGameView();
    }
    localStorage.removeItem('myGame');
  }
  if(codeFromUrl){ $('joinCode').value = codeFromUrl; show('join'); }
})();
