<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gioco Multiplayer</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{--bg:#0f1220;--card:#1a1f35;--acc:#6c8cff;--text:#eef0fb;--muted:#8a90b3;--ok:#3ecf8e;--err:#ff6b6b;--blue:#3f6cff;--red:#e0503a;--gold:#e0b23f}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:1.2rem;margin:0 0 16px;text-align:center}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2c3355;background:#12162a;color:var(--text);font-size:1rem}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;font-size:1rem;margin-top:14px;cursor:pointer}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.secondary{background:#2c3355}
  .player-row{display:flex;gap:8px;margin-bottom:8px}
  .player-row input{flex:1}
  .player-row button{width:auto;padding:10px 14px;margin:0;background:var(--err)}
  .add-btn{background:var(--card);border:1px dashed #2c3355;color:var(--muted)}
  .name-pick{display:flex;flex-wrap:wrap;gap:8px}
  .name-pick button{width:auto;margin:0;background:#2c3355;flex:1;min-width:100px}
  .name-pick button:disabled{background:#181c30;color:#4a5078}
  .msg{text-align:center;padding:10px;border-radius:8px;margin-top:10px;font-size:.9rem}
  .msg.err{background:#3a1e26;color:var(--err)}
  .link-box{display:flex;gap:8px}
  .link-box input{flex:1;font-size:.8rem}
  .hidden{display:none!important}
  .center{text-align:center;color:var(--muted);font-size:.9rem}
  .turn-banner{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:10px;padding:8px;border-radius:10px;background:#20264a}
  .turn-banner b{color:var(--gold)}
  .table{display:flex;flex-wrap:wrap;gap:6px;min-height:60px;padding:10px;background:#12162a;border-radius:10px;margin-bottom:10px}
  .chip{width:34px;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;text-align:center}
  .chip.blue{background:var(--blue)}
  .chip.red{background:var(--red)}
  .chip.special{background:#4b4f70;font-size:.5rem;padding:2px}
  .last-card{display:flex;justify-content:center;margin-bottom:6px}
  .last-card .chip{width:64px;height:88px;font-size:1.4rem;box-shadow:0 0 0 3px var(--acc)}
  .last-card .chip.special{font-size:.65rem}
  .thumbs{display:flex;gap:10px}
  .thumbs button{font-size:1.2rem}
  .thumbs .up{background:var(--ok)}
  .thumbs .down{background:var(--err)}
  .timerRow{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
  .countdown{font-size:1.4rem;font-weight:700;color:var(--gold)}
  #btnTimer{width:auto;padding:10px 16px;background:#3a3560}
  .plist{list-style:none;padding:0;margin:0}
  .plist li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;margin-bottom:5px;background:#12162a;font-size:.85rem}
  .plist li.active{border:1px solid var(--acc)}
  .plist li.out{opacity:.5}
  .plist .stats{color:var(--muted);display:flex;gap:10px}
  .rank-item{display:flex;justify-content:space-between;padding:10px;border-radius:8px;margin-bottom:6px;background:#12162a}
  .rank-item .pos{color:var(--gold);font-weight:700}
  .flip-deck{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;margin:14px 0}
  .flip-deck .chip.back{background:#2c3355;font-size:1.8rem;width:64px;height:88px;border:2px dashed #45508a}
  .flip-deck span{color:var(--muted);font-size:.8rem}
  @keyframes flipIn{ from{transform:rotateY(100deg);opacity:.2} to{transform:rotateY(0deg);opacity:1} }
  .flip-anim{ animation: flipIn .45s ease-out }
  @keyframes popIn{ from{transform:scale(2.2);opacity:.4} to{transform:scale(1);opacity:1} }
  .pop-anim{ animation: popIn .35s ease-in }
  .game-code{text-align:center;font-size:2rem;font-weight:800;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
  .game-code-small{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Gioco Multiplayer</h1>

  <div id="home" class="card">
    <button id="btnGoCreate">Crea una nuova partita (Master)</button>
    <button id="btnGoJoin" class="secondary">Entra in una partita</button>
  </div>

  <div id="create" class="card hidden">
    <label>Nomi dei giocatori (max 12)</label>
    <div id="playersList"></div>
    <button id="addPlayer" class="add-btn">+ Aggiungi giocatore</button>
    <label>Carte per giocatore</label>
    <select id="cardsPer">
      <option value="5">5 (lampo)</option>
      <option value="7">7 (breve)</option>
      <option value="9" selected>9 (media)</option>
      <option value="11">11 (lunga)</option>
    </select>
    <label>Passkey per accedere</label>
    <input id="passkey" placeholder="es. estate2026">
    <button id="btnCreate">Crea Partita</button>
    <div id="createMsg"></div>
  </div>

  <div id="share" class="card hidden">
    <p class="center">Partita creata! Il codice è:</p>
    <div id="codeOut" class="game-code"></div>
    <p class="center">oppure condividi direttamente il link:</p>
    <div class="link-box"><input id="linkOut" readonly><button id="copyLink" style="width:auto">Copia</button></div>
    <button id="btnMasterJoin" class="secondary">Entra anche tu nella partita</button>
  </div>

  <div id="join" class="card hidden">
    <label>Codice partita</label>
    <input id="joinCode" placeholder="es. ABCD" maxlength="4" style="text-transform:uppercase">
    <label>Passkey</label>
    <input id="joinPass" placeholder="passkey concordata">
    <button id="btnCheckPass">Continua</button>
    <div id="joinMsg"></div>
  </div>

  <div id="pickName" class="card hidden">
    <p class="center">Scegli il tuo nome dalla lista:</p>
    <div id="nameOptions" class="name-pick"></div>
    <div id="pickMsg"></div>
  </div>

  <div id="game" class="card hidden">
    <div id="gameCodeSmall" class="game-code-small"></div>
    <div id="turnBanner" class="turn-banner"></div>
    <div id="lastCardWrap" class="last-card hidden"></div>
    <div id="timerRow" class="timerRow hidden"><span class="countdown" id="countdown"></span></div>
    <div id="thumbs" class="thumbs hidden">
      <button class="up" id="btnUp">👍 Giusta</button>
      <button class="down" id="btnDown">👎 Sbagliata</button>
    </div>
    <button id="btnTimer" class="hidden">⏱️ Metti fretta</button>
    <div id="flipDeck" class="flip-deck hidden">
      <div class="chip back">🂠</div>
      <span>Tocca per girare una carta</span>
    </div>
    <label>Carte sul tavolo</label>
    <div id="table" class="table"></div>
    <ul id="plist" class="plist"></ul>
  </div>

  <div id="ranking" class="card hidden">
    <h1>🏆 Classifica finale</h1>
    <p class="center">In cima chi ha raccolto meno carte</p>
    <div id="rankList"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA_LFJnj0OmLl6DXmeNAgNCytj2G9945IM",
  authDomain: "meme-b94ac.firebaseapp.com",
  databaseURL: "https://meme-b94ac-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "meme-b94ac",
  storageBucket: "meme-b94ac.firebasestorage.app",
  messagingSenderId: "596659498343",
  appId: "1:596659498343:web:018361ae83b3ab68d013c2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = id => document.getElementById(id);
const show = id => ['home','create','share','join','pickName','game','ranking'].forEach(s => $(s).classList.toggle('hidden', s!==id));

function genCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join(''); }

// ---------- MAZZO ----------
const AUTO_EFFECTS = ['invert','skip','drawtwo'];
function buildDeck(){
  const letters8 = ['A','E','I','O'];
  const letters6 = ['U','B','C','D','F','G','L','M','N','P','R','S','T'];
  const letters2 = ['H','Z','Q'];
  const deck = []; let id=0;
  const addLetter = (l,count) => { for(let i=0;i<count;i++) deck.push({id:id++, type:'letter', letter:l, color: i<count/2?'blue':'red'}); };
  letters8.forEach(l=>addLetter(l,8));
  letters6.forEach(l=>addLetter(l,6));
  letters2.forEach(l=>addLetter(l,2));
  const special = [
    ['4 SILLABE',2,null],['5 SILLABE',2,null],['INVERTI GIRO',2,'invert'],
    ['SALTA TURNO',2,'skip'],['GIRA DUE CARTE',2,'drawtwo'],['CAMBIA TUTTO',4,'swap'],
    ['CUCINA',1,null],['STORIA',1,null],['GEOGRAFIA',1,null],['NATURA',1,null],
    ['PROFESSIONI',1,null],['MARCHI',1,null],['PERSONAGGI',1,null]
  ];
  special.forEach(([label,count,eff]) => { for(let i=0;i<count;i++) deck.push({id:id++, type:'special', label, effect:eff}); });
  return deck;
}
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

// ---------- HOME ----------
$('btnGoCreate').onclick = () => show('create');
$('btnGoJoin').onclick = () => show('join');

function addPlayerRow(val=''){
  const row = document.createElement('div'); row.className='player-row';
  row.innerHTML = `<input class="pname" value="${val}" placeholder="Nome giocatore"><button type="button">✕</button>`;
  row.querySelector('button').onclick = () => row.remove();
  $('playersList').appendChild(row);
}
addPlayerRow(); addPlayerRow();
$('addPlayer').onclick = () => { if(document.querySelectorAll('.pname').length<12) addPlayerRow(); };

$('btnCreate').onclick = async () => {
  const names = [...document.querySelectorAll('.pname')].map(i=>i.value.trim()).filter(Boolean);
  const passkey = $('passkey').value.trim();
  const cardsPer = parseInt($('cardsPer').value);
  const msg = $('createMsg');
  if(names.length<2 || names.length>12){ msg.innerHTML='<div class="msg err">Da 2 a 12 giocatori</div>'; return; }
  if(new Set(names).size!==names.length){ msg.innerHTML='<div class="msg err">Nomi duplicati</div>'; return; }
  if(!passkey){ msg.innerHTML='<div class="msg err">Inserisci una passkey</div>'; return; }

  const code = genCode();
  const deck = shuffle(buildDeck());
  const hands = {}; names.forEach((n,i)=>{ hands[n] = deck.slice(i*cardsPer,(i+1)*cardsPer).map(c=>c.id); });
  const deckLookup = {}; deck.forEach(c => deckLookup[c.id]=c);
  const claims = {}; names.forEach(n=>claims[n]=false);
  const errorPiles = {}; names.forEach(n=>errorPiles[n]=0);

  await db.ref('games/'+code).set({
    passkey, cardsPer, players: names, claims, deckLookup, hands,
    table: [], hidden: [], lastCardId: null, lastOwner: null,
    errorPiles, turnIndex: 0, direction: 1, flipsRemaining: 1, nextRequiredFlips: 1,
    timerActive: false, timerBy: null, timerEndsAt: null,
    status: 'waiting', createdAt: Date.now()
  });
  $('linkOut').value = location.href.split('?')[0]+'?game='+code;
  $('codeOut').textContent = code;
  window.__lastCode = code;
  show('share');
};
$('copyLink').onclick = () => { $('linkOut').select(); document.execCommand('copy'); };
$('btnMasterJoin').onclick = () => { $('joinCode').value = window.__lastCode; startJoinFlow(window.__lastCode); };

// ---------- JOIN ----------
$('btnCheckPass').onclick = async () => {
  const code = $('joinCode').value.trim().toUpperCase();
  const pass = $('joinPass').value.trim();
  const msg = $('joinMsg');
  if(!code||!pass){ msg.innerHTML='<div class="msg err">Compila entrambi i campi</div>'; return; }
  const snap = await db.ref('games/'+code).get();
  if(!snap.exists()){ msg.innerHTML='<div class="msg err">Partita non trovata</div>'; return; }
  if(snap.val().passkey!==pass){ msg.innerHTML='<div class="msg err">Passkey errata</div>'; return; }
  startJoinFlow(code, snap.val());
};

let currentGame = { code:null, playerName:null };

async function startJoinFlow(code, data){
  currentGame.code = code;
  if(!data) data = (await db.ref('games/'+code).get()).val();
  const saved = JSON.parse(localStorage.getItem('myGame')||'null');
  if(saved && saved.code===code && data.claims[saved.name]){ currentGame.playerName = saved.name; return openGameView(); }
  const wrap = $('nameOptions'); wrap.innerHTML='';
  data.players.forEach(name => {
    const b = document.createElement('button');
    b.textContent = name + (data.claims[name] ? ' ✓' : '');
    b.disabled = !!data.claims[name];
    b.onclick = () => claimName(code, name);
    wrap.appendChild(b);
  });
  show('pickName');
}

async function claimName(code, name){
  const res = await db.ref('games/'+code+'/claims/'+name).transaction(cur => cur ? undefined : true);
  if(!res.committed){ $('pickMsg').innerHTML='<div class="msg err">Nome già preso</div>'; return; }
  currentGame.playerName = name;
  localStorage.setItem('myGame', JSON.stringify({code, name}));
  const snap = await db.ref('games/'+code).get(); const data = snap.val();
  if(Object.values(data.claims).every(Boolean) && data.status==='waiting'){
    await db.ref('games/'+code+'/status').set('playing');
  }
  openGameView();
}

// ---------- GAME VIEW ----------
let countdownTimer = null;
let lastRenderedCardId = null;
let lastTableLen = 0;
function openGameView(){
  show('game');
  $('gameCodeSmall').textContent = 'Codice partita: '+currentGame.code;
  db.ref('games/'+currentGame.code).on('value', snap => { if(snap.exists()) renderGame(snap.val()); });
}

function cardEl(card){
  const d = document.createElement('div');
  d.className = 'chip ' + (card.type==='letter' ? card.color : 'special');
  d.textContent = card.type==='letter' ? card.letter : card.label;
  return d;
}

function activePlayers(data){ return data.players.filter(n => (data.hands[n]||[]).length>0); }

function nextIndex(data, dir){
  const n = data.players.length; let i = data.turnIndex;
  for(let guard=0; guard<n; guard++){
    i = ((i+dir)%n+n)%n;
    if((data.hands[data.players[i]]||[]).length>0) return i;
  }
  return null; // nessuno ha più carte
}

function renderGame(data){
  if(data.status==='finished'){ return renderRanking(data); }
  const me = currentGame.playerName;
  const hasPending = data.lastCardId!==null && data.lastCardId!==undefined;
  const awaitingMyAnswer = hasPending && data.lastOwner===me;
  const iAmOut = (data.hands[me]||[]).length===0 && !awaitingMyAnswer;
  const myTurn = data.players[data.turnIndex]===me && !iAmOut;

  $('turnBanner').innerHTML = data.status==='waiting'
    ? 'In attesa che tutti si uniscano...'
    : (iAmOut ? '⏸️ Hai finito le carte, aspetti gli altri' : `🎯 Turno di <b>${data.players[data.turnIndex]}</b>`);

  const tableWrap = $('table'); tableWrap.innerHTML='';
  const table = data.table||[];
  table.forEach((t,i) => {
    const el = cardEl(data.deckLookup[t.id]);
    if(i===table.length-1 && table.length>lastTableLen) el.classList.add('pop-anim');
    tableWrap.appendChild(el);
  });
  lastTableLen = table.length;

  const lastWrap = $('lastCardWrap'); const thumbs = $('thumbs');
  if(hasPending){
    lastWrap.classList.remove('hidden'); lastWrap.innerHTML='';
    const el = cardEl(data.deckLookup[data.lastCardId]);
    if(data.lastCardId!==lastRenderedCardId) el.classList.add('flip-anim');
    lastWrap.appendChild(el);
    thumbs.classList.toggle('hidden', data.lastOwner!==me);
  } else { lastWrap.classList.add('hidden'); thumbs.classList.add('hidden'); }
  lastRenderedCardId = hasPending ? data.lastCardId : null;

  // cronometro
  const timerRow = $('timerRow'); const btnTimer = $('btnTimer');
  if(hasPending && data.lastOwner!==me && !data.timerActive){ btnTimer.classList.remove('hidden'); } else { btnTimer.classList.add('hidden'); }
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  if(data.timerActive && data.timerEndsAt){
    timerRow.classList.remove('hidden');
    const tick = () => {
      const left = Math.max(0, Math.ceil((data.timerEndsAt - Date.now())/1000));
      $('countdown').textContent = `⏱️ ${data.timerBy} ha messo fretta: ${left}s`;
      if(left<=0) clearInterval(countdownTimer);
    };
    tick();
    countdownTimer = setInterval(tick,250);
  } else {
    timerRow.classList.add('hidden');
    $('countdown').textContent = '';
  }

  $('flipDeck').classList.toggle('hidden', !(myTurn && !hasPending && data.status==='playing' && (data.hands[me]||[]).length>0));

  const pl = $('plist'); pl.innerHTML='';
  data.players.forEach((name,i) => {
    const li = document.createElement('li');
    const out = (data.hands[name]||[]).length===0;
    li.className = (i===data.turnIndex && !out ? 'active ' : '') + (out ? 'out' : '');
    li.innerHTML = `<span>${name}${name===me?' (tu)':''}${out?' — fuori':''}</span><span class="stats"><span>🃏 ${(data.hands[name]||[]).length}</span><span>🗑️ ${data.errorPiles[name]||0}</span></span>`;
    pl.appendChild(li);
  });
}

function renderRanking(data){
  show('ranking');
  const sorted = data.players.map(n=>({name:n,count:data.errorPiles[n]||0})).sort((a,b)=>a.count-b.count);
  let rank = 0, prevCount = null;
  const list = $('rankList'); list.innerHTML='';
  sorted.forEach((p,i) => {
    if(p.count!==prevCount){ rank = i+1; prevCount = p.count; }
    const d = document.createElement('div'); d.className='rank-item';
    d.innerHTML = `<span class="pos">#${rank} ${p.name}</span><span>${p.count} carte raccolte</span>`;
    list.appendChild(d);
  });
}

// ---------- AZIONI ----------
async function afterCardResolved(code, data, tableAfter, hiddenAfter, ownerOfCollected, collectedCount){
  // gestisce raccolta carte, decremento flip e avanzamento turno
  let updates = { lastCardId: null, lastOwner: null, timerActive:false, timerBy:null, timerEndsAt:null };
  if(ownerOfCollected){
    updates['errorPiles/'+ownerOfCollected] = (data.errorPiles[ownerOfCollected]||0) + collectedCount;
    updates.table = [];
    updates.hidden = [];
  } else {
    updates.table = tableAfter;
    updates.hidden = hiddenAfter;
  }
  const remaining = (data.flipsRemaining||1) - 1;
  const currentHandEmpty = (data.hands[data.players[data.turnIndex]]||[]).length===0;
  if(remaining>0 && !currentHandEmpty){
    updates.flipsRemaining = remaining;
  } else {
    const allEmpty = data.players.every(n => (data.hands[n]||[]).length===0);
    if(allEmpty){ updates.status='finished'; }
    else {
      const ni = nextIndex(data, data.direction);
      updates.turnIndex = ni===null ? data.turnIndex : ni;
      updates.flipsRemaining = data.nextRequiredFlips || 1;
      updates.nextRequiredFlips = 1;
    }
  }
  await db.ref('games/'+code).update(updates);
}

$('flipDeck').onclick = async () => {
  const code = currentGame.code, me = currentGame.playerName;
  const snap = await db.ref('games/'+code).get(); const data = snap.val();
  if(data.players[data.turnIndex]!==me) return;
  const hand = data.hands[me] || [];
  if(hand.length===0) return;
  const cardId = hand[hand.length-1];
  const res = await db.ref('games/'+code+'/hands/'+me).transaction(h => (h && h.length? h.slice(0,-1) : h));
  if(!res.committed) return;
  const card = data.deckLookup[cardId];

  if(card.type==='special' && AUTO_EFFECTS.includes(card.effect)){
    let direction = data.direction, extraSkip = false, nextRequiredFlips = data.nextRequiredFlips || 1;
    const newTable = [...(data.table||[]), {id:cardId, owner:me}];
    if(card.effect==='invert') direction = data.direction*-1;
    if(card.effect==='skip') extraSkip = true;
    if(card.effect==='drawtwo') nextRequiredFlips = 2;
    const dbUpdates = {};
    if(card.effect==='swap'){
      (data.table||[]).forEach(t => { const c = data.deckLookup[t.id]; if(c.type==='letter'){ dbUpdates['deckLookup/'+t.id+'/color'] = c.color==='blue'?'red':'blue'; } });
    }
    // avanzamento (salta turno di chi pesca; skip extra se effetto SALTA TURNO)
    const freshHand = res.snapshot.val() || [];
    const localData = {...data, hands:{...data.hands, [me]: freshHand}, direction};
    const allEmpty = localData.players.every(n => (localData.hands[n]||[]).length===0);
    if(allEmpty){ dbUpdates.status='finished'; }
    else {
      let ni = nextIndex(localData, direction);
      if(extraSkip && ni!==null){ const localData2 = {...localData, turnIndex: ni}; ni = nextIndex(localData2, direction); }
      dbUpdates.turnIndex = ni===null ? data.turnIndex : ni;
      dbUpdates.flipsRemaining = nextRequiredFlips;
      dbUpdates.nextRequiredFlips = 1;
    }
    dbUpdates.table = newTable; dbUpdates.direction = direction; dbUpdates.lastCardId=null; dbUpdates.lastOwner=null;
    await db.ref('games/'+code).update(dbUpdates);
  } else {
    const updates = { lastCardId: cardId, lastOwner: me };
    if(card.type==='special' && card.effect==='swap'){
      (data.table||[]).forEach(t => { const c = data.deckLookup[t.id]; if(c.type==='letter'){ updates['deckLookup/'+t.id+'/color'] = c.color==='blue'?'red':'blue'; } });
    }
    await db.ref('games/'+code).update(updates);
  }
};

$('btnUp').onclick = async () => {
  const code = currentGame.code;
  const snap = await db.ref('games/'+code).get(); const data = snap.val();
  if(data.lastOwner!==currentGame.playerName) return;
  const tableLen = (data.table||[]).length, hiddenLen = (data.hidden||[]).length;
  if(data.timerActive){
    // con il cronometro attivo, le carte (tavolo + monte nascosto) vanno a chi ha messo fretta
    await afterCardResolved(code, data, null, null, data.timerBy, tableLen+hiddenLen+1);
  } else {
    const card = data.deckLookup[data.lastCardId];
    let newTable = [...(data.table||[])];
    let newHidden = [...(data.hidden||[])];
    if(card.type==='letter'){
      const opp = card.color==='blue' ? 'red' : 'blue';
      const idx = newTable.findIndex(t => { const c = data.deckLookup[t.id]; return c.type==='letter' && c.letter===card.letter && c.color===opp; });
      if(idx>=0){
        const removed = newTable.splice(idx,1)[0];
        newHidden.push(removed, {id:data.lastCardId, owner:data.lastOwner});
      } else {
        newTable.push({id:data.lastCardId, owner:data.lastOwner});
      }
    } else {
      newTable.push({id:data.lastCardId, owner:data.lastOwner});
    }
    await afterCardResolved(code, data, newTable, newHidden, null, 0);
  }
};

$('btnDown').onclick = async () => {
  const code = currentGame.code;
  const snap = await db.ref('games/'+code).get(); const data = snap.val();
  if(data.lastOwner!==currentGame.playerName) return;
  const total = (data.table||[]).length + (data.hidden||[]).length + 1;
  await afterCardResolved(code, data, null, null, data.lastOwner, total);
};

$('btnTimer').onclick = async () => {
  const code = currentGame.code, me = currentGame.playerName;
  await db.ref('games/'+code+'/timerActive').transaction(cur => cur ? undefined : true);
  await db.ref('games/'+code).update({ timerBy: me, timerEndsAt: Date.now()+15000 });
};

(async () => {
  const params = new URLSearchParams(location.search);
  const codeFromUrl = params.get('game') ? params.get('game').toUpperCase() : null;
  const saved = JSON.parse(localStorage.getItem('myGame')||'null');
  if(saved && (!codeFromUrl || codeFromUrl===saved.code)){
    const snap = await db.ref('games/'+saved.code).get();
    if(snap.exists() && snap.val().claims[saved.name]){
      currentGame.code = saved.code; currentGame.playerName = saved.name;
      return openGameView();
    }
    localStorage.removeItem('myGame');
  }
  if(codeFromUrl){ $('joinCode').value = codeFromUrl; show('join'); }
})();

</script>
